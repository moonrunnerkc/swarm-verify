# One job, one Action. The checkout needs full history so the base commit is present.
name: swarm-verify
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # `v2` is the major; pin a full commit SHA where immutability matters.
      - uses: moonrunnerkc/swarm-verify@v2
