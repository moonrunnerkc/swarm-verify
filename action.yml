name: Swarm Verify
description: Measure a pull request's change against the base commit's own checks, test by test, and sign the result as an in-toto Statement.
author: Brad Kinnard
branding:
  icon: check-square
  color: green
inputs:
  base:
    description: Base ref to verify against. Defaults to the pull request's base branch.
    default: ""
  isolation:
    description: "`isolated` runs the checks in a container from a pinned image with the network closed after a recorded dependency stage; `host` runs them on the runner and is reported as not isolated."
    default: isolated
  dependencies:
    description: "`prepare` installs from the lockfile (or the base's declared setup command), `none` prepares nothing."
    default: prepare
  requirements:
    description: Path to a JSON array of requirements in the workspace. Absent means the result covers regressions only.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "24"
    # The Action runs the verifier built from this repository at the ref the workflow names.
    - name: Build the verifier from source
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
      run: |
        cd "$ACTION_ROOT"
        npm ci --no-audit --no-fund
        npm run build
    - name: Verify
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        BASE: ${{ inputs.base }}
        ISOLATION: ${{ inputs.isolation }}
        DEPENDENCIES: ${{ inputs.dependencies }}
        REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        node "$ACTION_ROOT/dist/swarm-verify.js" ci \
          --isolation "$ISOLATION" --dependencies "$DEPENDENCIES" \
          ${BASE:+--base "$BASE"} ${REQUIREMENTS:+--requirements "$REQUIREMENTS"}
