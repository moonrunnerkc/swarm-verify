# Real keyless signing with this job's own GitHub OIDC identity: verify signs through cosign and
# Sigstore, and the bundle is checked against the expected issuer and workflow identity and
# refused for tampered evidence, another issuer and other identities (scripts/keyless-signing.mjs).
# Only this repository's own branches run it; a fork's pull request gets no OIDC token.
name: keyless-signing

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - run: npm ci
      - run: npm run build
      - name: Sign keylessly and check the signer policy both ways
        env:
          # The certificate Fulcio issues a workflow names the workflow file at its ref.
          EXPECTED_IDENTITY: https://github.com/${{ github.workflow_ref }}
          EXPECTED_ISSUER: https://token.actions.githubusercontent.com
        run: node scripts/keyless-signing.mjs dist/swarm-verify.js "$RUNNER_TEMP/keyless"
      # The bundle, certificate and results only: no token is written anywhere under this path.
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyless-signing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/keyless/keyless-summary.json
            ${{ runner.temp }}/keyless/evidence
            ${{ runner.temp }}/keyless/forged.sigstore.json
