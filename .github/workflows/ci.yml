name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The doc-path check resolves released changelog sections against their tags.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # One command, the same one a release runs: it includes installing the packed tarball.
      - run: npm run gates

  # Every real repository the verifier has judged, at its base, with the patches judged on it and
  # the statuses they are expected to read (corpus/README.md). One job a patch (t6's eight in one
  # job outlasted its five hours); host where the container cannot build the base, as the entry says.
  corpus-entries:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: list
        run: |
          echo "ids=$(node -e 'const fs=require("fs");const ids=JSON.parse(fs.readFileSync("corpus/manifest.json","utf8")).flatMap(id=>{const e=JSON.parse(fs.readFileSync(`corpus/${id}/entry.json`,"utf8"));return e.local===true?[]:e.patches.map(p=>`${id}/${p.name}`)});console.log(JSON.stringify(ids))')" >> "$GITHUB_OUTPUT"
  corpus:
    needs: corpus-entries
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.corpus-entries.outputs.ids) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.13"
          enable-cache: false
      # A real pnpm, at the version depose pins: checks run under a private HOME with the network
      # closed, where corepack has no cache to fetch its shim's pnpm from.
      - run: npm install -g pnpm@9.15.0
      - run: npm ci
      - run: npm run build
      - name: Verify the patch against its entry
        env:
          ITEM: ${{ matrix.id }}
        run: node scripts/corpus.mjs --only "${ITEM%%/*}" --patches "${ITEM#*/}" --source github --out "corpus-${ITEM//\//-}.json"
