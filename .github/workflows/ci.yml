name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The doc-path check resolves released changelog sections against their tags.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # One command, the same one a release runs: it includes installing the packed tarball.
      - run: npm run gates

  # The packed package on exactly the Node version package.json declares as its minimum: packed
  # through the normal process on the development runtime, then installed and exercised by a
  # plain-Node consumer script (scripts/consumer-smoke.mjs) on 22.13.0. 22.12.0 is checked to
  # refuse it, so the minimum is measured, not read off a changelog.
  consumer-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pack through the normal process
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          npm pack --pack-destination "$RUNNER_TEMP/packs"
          sha256sum "$RUNNER_TEMP"/packs/*.tgz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
      - name: Run the packed package as a consumer on Node 22.13.0
        run: |
          test "$(node --version)" = v22.13.0
          node scripts/consumer-smoke.mjs "$RUNNER_TEMP"/packs/swarm-verify-*.tgz --expect-node v22.13.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
      - name: Below the minimum the package does not load
        run: |
          test "$(node --version)" = v22.12.0
          mkdir -p "$RUNNER_TEMP/below" && cd "$RUNNER_TEMP/below"
          echo '{ "name": "below", "private": true, "type": "module" }' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/packs/swarm-verify-*.tgz
          if node -e 'await import("swarm-verify")' 2> load.err; then
            echo "swarm-verify loaded on 22.12.0; the declared minimum is not the measured one" >&2
            exit 1
          fi
          grep "does not provide an export named 'stripTypeScriptTypes'" load.err

  # Every real repository the verifier has judged, at its base, with the patches judged on it and
  # the statuses they are expected to read (corpus/README.md). One job a patch (t6's eight in one
  # job outlasted its five hours); host where the container cannot build the base, as the entry says.
  corpus-entries:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: list
        run: |
          echo "ids=$(node -e 'const fs=require("fs");const ids=JSON.parse(fs.readFileSync("corpus/manifest.json","utf8")).flatMap(id=>{const e=JSON.parse(fs.readFileSync(`corpus/${id}/entry.json`,"utf8"));return e.local===true?[]:e.patches.map(p=>`${id}/${p.name}`)});console.log(JSON.stringify(ids))')" >> "$GITHUB_OUTPUT"
  corpus:
    needs: corpus-entries
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.corpus-entries.outputs.ids) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.13"
          enable-cache: false
      # A real pnpm, at the version depose pins: checks run under a private HOME with the network
      # closed, where corepack has no cache to fetch its shim's pnpm from.
      - run: npm install -g pnpm@9.15.0
      - run: npm ci
      - run: npm run build
      - name: Verify the patch against its entry
        env:
          ITEM: ${{ matrix.id }}
        run: |
          mkdir -p corpus-records
          node scripts/corpus.mjs --only "${ITEM%%/*}" --patches "${ITEM#*/}" --source github --out "corpus-records/${ITEM//\//-}.json"
      # The record (statuses, digests, revisions, verifier commit; no logs), whatever the outcome.
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-record-${{ strategy.job-index }}
          path: corpus-records/
          if-no-files-found: error

  # One coverage report over every public patch's record: complete only when each ran to a verdict
  # exactly once, with agreement counted apart from execution.
  corpus-coverage:
    needs: corpus
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: corpus-record-*
          path: corpus-records
          merge-multiple: true
      - run: node scripts/corpus-coverage.mjs --require public --out corpus-coverage.json corpus-records/*.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-coverage
          path: corpus-coverage.json
