# Run by hand after moving the v3 alias: proves `moonrunnerkc/swarm-verify@v3` resolves, verifies a
# small change outside a pull request and signs it keylessly with this workflow's identity.
name: action-smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Write a fixture repository with a base commit and a change on top
        shell: bash
        run: |
          git init -q -b main .
          git config user.name smoke
          git config user.email smoke@example.invalid
          cat > package.json <<'JSON'
          { "name": "fixture", "version": "1.0.0", "private": true, "type": "module",
            "scripts": { "test": "node --test" } }
          JSON
          printf 'export const add = (a, b) => a - b;\n' > add.js
          printf 'import { test } from "node:test";\nimport assert from "node:assert/strict";\nimport { add } from "./add.js";\ntest("adds zero", () => assert.equal(add(2, 0), 2));\n' > add.test.js
          git add . && git commit -q -m base
          git branch base
          printf 'export const add = (a, b) => a + b;\n' > add.js
          printf 'test("adds two numbers", () => assert.equal(add(2, 3), 5));\n' >> add.test.js
          git commit -q -am "Add two numbers"
      - uses: moonrunnerkc/swarm-verify@v3
        id: verify
        with:
          base: base
          dependencies: none
          sigstore: "true"
      - name: Check the bundle names this workflow and the change
        shell: bash
        env:
          EVIDENCE: ${{ steps.verify.outputs.evidence-directory }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          STATE: ${{ steps.verify.outputs.state }}
          DELIVERY: ${{ steps.verify.outputs.delivery }}
        run: |
          test "$STATE" = complete
          test "$DELIVERY" = signed
          cosign verify-blob-attestation --bundle "$EVIDENCE/attestation.sigstore.json" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --type https://github.com/moonrunnerkc/swarm-verify/result/v1 "$EVIDENCE/change.patch"
