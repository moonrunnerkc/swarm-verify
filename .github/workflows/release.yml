name: release

# A full version tag (v2.0.0) publishes swarm-verify, after the gates, which install the packed
# tarball into a fresh prefix and verify a change through it. An Action alias such as v2 is not a
# release and starts nothing.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  # npm provenance signs the tarball against this workflow and commit.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run gates
      - name: Check the tag matches the package version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $PKG; refusing to publish" >&2
            exit 1
          fi
      # A version published from a workstation (the account's two-factor setting needs a person)
      # is compared, not published again: the registry's tarball must be this commit's pack.
      - name: Compare with the registry where this version is already published
        id: registry
        run: |
          NAME="$(node -p "require('./package.json').name")"
          PKG="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view "$NAME@$PKG" dist.integrity 2>/dev/null || true)"
          if [ -z "$PUBLISHED" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Built first, so the pack's JSON is all it prints; prepack would build the same files.
          npm run build >&2
          PACKED="$(npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" | node -e 'let s = ""; process.stdin.on("data", (c) => (s += c)).on("end", () => console.log(JSON.parse(s)[0].integrity))')"
          if [ "$PUBLISHED" != "$PACKED" ]; then
            echo "$NAME@$PKG on the registry is $PUBLISHED, and this commit packs to $PACKED" >&2
            exit 1
          fi
          echo "$NAME@$PKG on the registry is this commit's pack ($PACKED)"
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.registry.outputs.published == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
