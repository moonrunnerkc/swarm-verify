name: release

# A full version tag (v2.0.2) publishes swarm-verify, after the gates, which install the packed
# tarball into a fresh prefix and verify a change through it. Where the version is already on the
# registry, it compares a pack of the tag with it instead. An Action alias such as v2 is not a
# release and starts nothing.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  # Trusted publishing: npm takes this job's OIDC token in place of a stored npm token, and signs
  # the provenance statement against this workflow and commit.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          # No dependency cache in a release build, as npm's trusted-publishing example has it.
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later (docs.npmjs.com/trusted-publishers).
      - name: Check npm meets the trusted-publishing minimum
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))) process.exit(0);
            console.error(`npm ${process.argv[1]} is older than 11.5.1, which trusted publishing needs`);
            process.exit(1);
          ' "$(npm --version)"
      - run: npm ci
      - run: npm run gates
      - name: Check the tag matches the package version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $PKG; refusing to publish" >&2
            exit 1
          fi
      # A version already published (2.0.1 was, from a workstation) is compared, not published
      # again: the registry's tarball must be this commit's pack.
      - name: Compare with the registry where this version is already published
        id: registry
        run: |
          NAME="$(node -p "require('./package.json').name")"
          PKG="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view "$NAME@$PKG" dist.integrity 2>/dev/null || true)"
          if [ -z "$PUBLISHED" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Built first, so the pack's JSON is all it prints; prepack would build the same files.
          npm run build >&2
          PACKED="$(npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" | node -e 'let s = ""; process.stdin.on("data", (c) => (s += c)).on("end", () => console.log(JSON.parse(s)[0].integrity))')"
          if [ "$PUBLISHED" != "$PACKED" ]; then
            echo "$NAME@$PKG on the registry is $PUBLISHED, and this commit packs to $PACKED" >&2
            exit 1
          fi
          echo "$NAME@$PKG on the registry is this commit's pack ($PACKED)"
          echo "published=true" >> "$GITHUB_OUTPUT"
      # A real sealed task through the packed install before anything reaches the registry: pubprep's
      # --reviewers feature, its held-out cases sealed and checked on the reference patch, and
      # every patch judged on it read as the corpus expects. A version that cannot judge it right
      # is not published.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.13"
          enable-cache: false
      - name: Judge a sealed task through the packed install
        if: steps.registry.outputs.published == 'false'
        run: |
          npm pack --silent --pack-destination "$RUNNER_TEMP/packs"
          mkdir -p "$RUNNER_TEMP/prefix" && cd "$RUNNER_TEMP/prefix"
          echo '{ "name": "smoke", "private": true }' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/packs/swarm-verify-*.tgz
          cd "$GITHUB_WORKSPACE"
          node scripts/corpus.mjs --only cmp-feature-pubprep --source github --cli "$RUNNER_TEMP/prefix/node_modules/swarm-verify/dist/swarm-verify.js"
      - name: Publish
        if: steps.registry.outputs.published == 'false'
        run: npm publish --provenance --access public
